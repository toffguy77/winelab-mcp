name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # еженедельно: не сломался ли внутренний API сайта

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=winelab_mcp --cov-report=term-missing
      - name: Smoke — сервер поднимается
        run: winelab-mcp --version

  build:
    name: Сборка пакета
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Установка колеса в чистое окружение
        run: |
          uv venv /tmp/fresh
          uv pip install --python /tmp/fresh dist/*.whl
          /tmp/fresh/bin/winelab-mcp --version
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  live:
    name: Канарейка API winelab.ru
    runs-on: ubuntu-latest
    # Сайт чужой и может быть недоступен из CI — падение здесь информационное.
    continue-on-error: true
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv pip install --system -e ".[dev]"
      - env:
          WINELAB_LIVE: "1"
        run: pytest tests/test_live.py -v

  ci-ok:
    # Единственный чек, который требует защита ветки: матрица и имена версий
    # Python будут меняться, а этот шлюз остаётся стабильным.
    name: CI пройден
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()
    steps:
      - name: Свести результаты
        run: |
          echo "тесты: ${{ needs.test.result }}, сборка: ${{ needs.build.result }}"
          test "${{ needs.test.result }}" = success
          test "${{ needs.build.result }}" = success
