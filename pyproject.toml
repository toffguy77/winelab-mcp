[project]
name = "winelab-mcp"
version = "0.3.0"
description = "MCP-сервер к каталогу winelab.ru (ВинЛаб): поиск товаров, магазины, наличие, корзина"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "toffguy77" }]
keywords = ["mcp", "model-context-protocol", "winelab", "llm", "claude", "retail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Natural Language :: Russian",
]
dependencies = [
    "mcp[cli]>=1.2.0,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/toffguy77/winelab-mcp"
Repository = "https://github.com/toffguy77/winelab-mcp"
Issues = "https://github.com/toffguy77/winelab-mcp/issues"

[project.scripts]
winelab-mcp = "winelab_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["winelab_mcp"]

[tool.hatch.build.targets.sdist]
include = ["winelab_mcp", "tests", "README.md", "API.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: ходит в настоящий winelab.ru (по умолчанию пропускается)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "SIM105"]
